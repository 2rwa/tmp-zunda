<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tmp-zunda A/B compare</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{max-width:1180px;margin:2rem auto;padding:0 1rem;line-height:1.55}
h1{margin-bottom:.25rem}
.sub{opacity:.72;margin-top:0}
.toolbar,.grid{display:grid;gap:1rem}
.toolbar{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:1rem 0}
.grid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{border:1px solid #8886;border-radius:16px;padding:1rem}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
label{display:grid;gap:.25rem;font-size:.9rem}
select,button{font:inherit;padding:.5rem;border-radius:8px}
button{cursor:pointer}
audio{width:100%;margin:.9rem 0}
.meta{font-family:ui-monospace,monospace;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;background:#8882;border-radius:8px;padding:.7rem}
.haiku{font-size:1.25rem;margin:.2rem 0}
.reading{opacity:.72}
.summary{margin-top:1rem;font-size:.9rem;opacity:.8}
@media(max-width:620px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>ずんだもん × 俳句 × 音階 A/B比較</h1>
<p class="sub">VOICEVOX:ずんだもん — 2,880 MP3 から条件を選んで聴き比べ</p>

<div class="toolbar">
  <button id="copyAToB">Aの条件 → B</button>
  <button id="copyBToA">Bの条件 → A</button>
  <button id="playAB">A → B 連続再生</button>
  <button id="stopAll">停止</button>
</div>

<div class="grid">
  <section class="card" data-side="A">
    <h2>A</h2>
    <div class="haiku"></div>
    <div class="reading"></div>
    <div class="controls"></div>
    <audio controls preload="metadata"></audio>
    <div class="meta"></div>
  </section>

  <section class="card" data-side="B">
    <h2>B</h2>
    <div class="haiku"></div>
    <div class="reading"></div>
    <div class="controls"></div>
    <audio controls preload="metadata"></audio>
    <div class="meta"></div>
  </section>
</div>

<div id="summary" class="summary">results/index.json を読み込み中…</div>

<script>
(async()=>{
  const idx = await fetch("./results/index.json").then(r=>{
    if(!r.ok) throw new Error("index.json HTTP "+r.status);
    return r.json();
  });

  const manifests = {};
  for (const h of idx.haiku) {
    manifests[h.slug] = await fetch("./results/"+h.manifest).then(r=>{
      if(!r.ok) throw new Error(h.manifest+" HTTP "+r.status);
      return r.json();
    });
  }

  const haikuOptions = idx.haiku.map(h=>({value:h.slug,label:h.text+" — "+h.author}));
  const sides = {};

  function uniq(m,key){ return [...new Set(m.variants.map(v=>String(v[key])))]; }

  function addSelect(container,label,key,values,onChange){
    const l=document.createElement("label");
    l.textContent=label;
    const s=document.createElement("select");
    for(const v of values){
      const o=document.createElement("option");
      o.value=v.value??v;
      o.textContent=v.label??v;
      s.appendChild(o);
    }
    s.addEventListener("change",onChange);
    l.appendChild(s);
    container.appendChild(l);
    return s;
  }

  function build(sideName){
    const root=document.querySelector('[data-side="'+sideName+'"]');
    const controls=root.querySelector(".controls");
    const audio=root.querySelector("audio");
    const state={root,controls,audio,selects:{}};

    state.selects.haiku=addSelect(controls,"俳句","haiku",haikuOptions,()=>{
      rebuildVariantControls(state);
    });
    sides[sideName]=state;
    rebuildVariantControls(state);
    return state;
  }

  function rebuildVariantControls(state){
    const slug=state.selects.haiku.value;
    const m=manifests[slug];

    for(const k of ["bpm","grid","swing","melody"]){
      if(state.selects[k]){
        state.selects[k].closest("label").remove();
        delete state.selects[k];
      }
    }

    const keys=[
      ["bpm","BPM"],
      ["grid","Grid"],
      ["swing","Swing"],
      ["melody","Melody"]
    ];
    for(const [k,label] of keys){
      state.selects[k]=addSelect(state.controls,label,k,uniq(m,k),()=>choose(state));
    }
    choose(state);
  }

  function choose(state){
    const slug=state.selects.haiku.value;
    const m=manifests[slug];
    const v=m.variants.find(x =>
      String(x.bpm)===state.selects.bpm.value &&
      String(x.grid)===state.selects.grid.value &&
      String(x.swing)===state.selects.swing.value &&
      String(x.melody)===state.selects.melody.value
    );
    if(!v) return;

    state.current={manifest:m,variant:v};
    state.root.querySelector(".haiku").textContent=m.text;
    state.root.querySelector(".reading").textContent=m.author+" / "+m.reading;
    state.audio.src="./results/"+m.slug+"/"+v.file;
    state.root.querySelector(".meta").textContent=[
      v.id,
      "duration: "+v.duration_seconds+" sec",
      "size: "+Math.round(v.size_bytes/1024)+" KiB",
      "mora target: "+v.target_mora_seconds+" sec",
      "melody: "+v.melody_notes.join(" ")
    ].join("\n");
  }

  function copy(from,to){
    const a=sides[from], b=sides[to];
    b.selects.haiku.value=a.selects.haiku.value;
    rebuildVariantControls(b);
    for(const k of ["bpm","grid","swing","melody"]){
      b.selects[k].value=a.selects[k].value;
    }
    choose(b);
  }

  build("A");
  build("B");

  // Start B from a contrasting default so the first screen is already comparative.
  if(sides.B.selects.melody.options.length>1){
    sides.B.selects.melody.selectedIndex=1;
    choose(sides.B);
  }

  document.getElementById("copyAToB").onclick=()=>copy("A","B");
  document.getElementById("copyBToA").onclick=()=>copy("B","A");
  document.getElementById("stopAll").onclick=()=>{
    for(const s of Object.values(sides)){ s.audio.pause(); s.audio.currentTime=0; }
  };
  document.getElementById("playAB").onclick=async()=>{
    const a=sides.A.audio,b=sides.B.audio;
    a.pause(); b.pause(); a.currentTime=0; b.currentTime=0;
    a.onended=()=>{ b.currentTime=0; b.play().catch(()=>{}); };
    await a.play();
  };

  document.getElementById("summary").textContent =
    "完了俳句: "+idx.haiku_completed+
    " / MP3: "+idx.mp3_files.toLocaleString()+
    " / 合計: "+(idx.total_mp3_bytes/1024/1024).toFixed(1)+" MiB";
})().catch(e=>{
  document.getElementById("summary").textContent="読み込み失敗: "+e;
});
</script>
</body>
</html>
